  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const data = episodes[id];

  if (data) {
    document.getElementById("animeTitle").innerText = data.title;
    const ul = document.getElementById("episodeList");
    data.epList.forEach(ep => {
      const li = document.createElement("li");
      li.innerHTML = `<iframe src="${ep.link}" frameborder="0" allow="autoplay"></iframe>`;
      ul.appendChild(li);
    });
  } else {
    document.body.innerHTML = "<h2 style='text-align:center'>Anime not found</h2>";
  }
</script>

</body>
